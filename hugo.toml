baseURL = 'https://blog.jonivirtanen.net/'
defaultContentLanguage = 'en'
languageCode = 'en-US'
title = 'Joni Virtanen'
enableEmoji = true

summaryLength = 20  # number of words for article summaries

[pagination]
    pagerSize = 5  # number of articles per page in the index

[params]
    author = "Joni Virtanen"
    description = "My little corner of the interwebs"  # this will be added as metadata
    posts = "posts"  # content directory where to find home page posts; default searches in "posts" and "post"

    fontFamily = "JetBrains Mono"  # changes the font, default "JetBrains Mono"
    titleFontFamily = "JetBrains Mono"  # font used for titles and headings
    monospaceFontFamily = "JetBrains Mono"  # changes the monospace font for code, default "JetBrains Mono"

    # multipliers applied to font sizes, useful for custom fonts that may be too big or too small
    titleFontSizeMultiplier = 1.0
    mainFontSizeMultiplier = 1.0
    monoFontSizeMultiplier = 1.0

    contentWidth = "800px"  # maximum width of the site content, css syntax

    mobileHamburgerNav = true  # alternative hamburger menu layout for the main nav menu when screen is small

    [taxonomies]
        genre = 'genres'
        tag = 'tags'
        status = 'status'
        readDate = "readDates"
        bookAuthor = 'bookAuthors'
        bookTitle = 'bookTitle'

[menu]
    [[menu.main]]
        identifier = "books"
        name = "Books"
        url = "/books/"
        weight = 10
    [[menu.main]]
        identifier = "/slash"
        name = "/slash"
        url = "/slash/"
        weight = 10
